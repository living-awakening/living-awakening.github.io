name: Pull request validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:content
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:static
      - name: Verify static export
        run: |
          test -s out/index.html
          test -s out/404.html || echo 'No custom 404 page; acceptable for single-page site'
          if grep -R -l -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' out; then exit 1; fi
